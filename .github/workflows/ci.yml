# Build and tests for the StudyAtlas app (also guards the existing search / compare features).
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    working-directory: studyatlas
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studyatlas/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

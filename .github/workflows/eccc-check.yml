name: eccc-check
on:
  push:
    branches: [claude/v1.6.3-eccc-check]
    paths: [studyatlas/collector/eccc-check.ts, .github/workflows/eccc-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: studyatlas } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: studyatlas/package-lock.json }
      - run: npm ci
      - run: npx tsx collector/eccc-check.ts

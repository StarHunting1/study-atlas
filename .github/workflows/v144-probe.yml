# TEMPORARY (Ver.1.4.4): one-off metadata probe on this branch only; removed after the result is recorded.
name: v144-probe
on:
  push:
    branches: [claude/v1.4.4-manchester-climate]
    paths: [".github/workflows/v144-probe.yml", "studyatlas/collector/v144-probe.ts"]
permissions:
  contents: read
defaults:
  run:
    working-directory: studyatlas
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studyatlas/package-lock.json
      - run: npm ci
      - run: npx tsx collector/v144-probe.ts

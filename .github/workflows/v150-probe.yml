name: v150-probe
on:
  push:
    branches: [claude/v1.5.0-toronto-london]
    paths: ["studyatlas/collector/v150-probe.ts", ".github/workflows/v150-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: studyatlas } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: studyatlas/package-lock.json }
      - run: npm ci
      - run: npx tsx collector/v150-probe.ts

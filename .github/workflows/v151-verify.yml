name: v151-verify
on:
  push:
    branches: [claude/v1.5.1-rent-verification]
    paths: ["studyatlas/collector/verify-rents.ts", ".github/workflows/v151-verify.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: studyatlas } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: studyatlas/package-lock.json }
      - run: npm ci
      - run: npx tsx collector/verify-rents.ts

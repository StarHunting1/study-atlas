name: v160-probe
on:
  push:
    branches: [claude/v1.6.0-sydney-melbourne]
    paths: [studyatlas/collector/v160-probe.ts, .github/workflows/v160-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: studyatlas } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: studyatlas/package-lock.json }
      - run: npm ci
      - run: npx tsx collector/v160-probe.ts
